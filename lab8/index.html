<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos</title>
</head>
<body id="colorBox">
 <!-- Menu de navegação -->
 
    <nav>
    <a href="eventos.html">Gunna</a>
    <a href="index.html">Eventos</a>
    </nav>

    <h1>Eventos</h1>
    <div>
        <p id="passar-por-cima">1. Passa por aqui!</p>
    </div>

    <div>
        <p id="pinta-me">2. Pinta-me!</p>
        <button data-color="red">Red</button>
        <button data-color="green">Green</button>
        <button data-color="blue">Blue</button>
    </div>
    

    <div>
        <p>3. Experimenta escrever... 
            <input type="text" id="inputText" oninput="showText()" placeholder="Escreve algo aqui">
        </p>
    </div>

    <div>
        <p>4. Escolha uma cor para o fundo:</p>
        <select id="colorSelect">
            <option value="white">White</option>
            <option value="lightblue">Light Blue</option>
            <option value="lightgreen">Light Green</option>
            <option value="yellow">Yellow</option>
            <option value="pink">Pink</option>
        </select>
    </div>
    

    <div>
        <p>5. <button onclick="count()">Conta!</button>  
            <span id="countDisplay">0</span>
        </p>
    </div>
    

    <div>
        <p>6. 
            <form id="userForm" style="display: inline;">
                <input type="text" id="nome" name="nome" placeholder="Nome" required style="margin-right: 5px;">
                <input type="number" id="idade" name="idade" placeholder="Idade" required style="margin-right: 5px;">
                <button type="submit">Submit</button>
            </form>
        </p>
        <div id="greeting"></div>
    </div>
    
    <div>
        <p>7. Automatic Counter: <span id="autoCounter">0</span></p>
    </div>

    <!-- HTML já carregado! -->
    <script src="main.js"></script>
</body>
</html>
