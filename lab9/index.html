<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Cabeçalho -->
    <header>
        <h1>Loja Online</h1>
        <nav>
            <ul><a href="#produtos">Produtos</a></ul>
            <ul><a href="#cesto">Cesto</a></ul>
        </nav>
    </header>

    <!-- Conteúdo Principal -->
    <main>
        <!-- Seção de Produtos -->
        <section id="produtos">
            <h2>Lista de Produtos</h2>
            <!-- Contêiner pai para os produtos -->
            <section id="lista-produtos" class="produtos-container"></section>
        </section>

        <!-- Seção do Cesto -->
        <section id="cesto">
            <h2>Seu Cesto</h2>
            <!-- Contêiner pai para os produtos no cesto -->
            <section id="produtos-cesto" class="cesto-container"></section>
        </section>
    </main>

    <!-- Rodapé -->
    <footer>
        <p>&copy; 2024 Loja Online - Todos os direitos reservados.</p>
    </footer>

    <!-- Scripts -->
    <script src="produtos.js"></script>
    <script src="main.js"></script>
</body>
</html>
